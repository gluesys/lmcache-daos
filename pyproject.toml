[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-daos"
# Single-sourced from lmcache_daos/__init__.py -- see [tool.setuptools.dynamic]
dynamic = ["version"]
description = "DAOS storage backends for LMCache: in-process connector, MP-mode L2 adapter, and an experimental GPU-direct backend"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Gluesys Co., Ltd." }]
keywords = ["lmcache", "daos", "kv-cache", "vllm", "gpudirect"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
    "Intended Audience :: Developers",
]
# No hard runtime deps: uses ctypes against the system libdaos/libdfs, and
# LMCache is expected to already be present in the serving environment.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/gluesys/lmcache-daos"
Changelog = "https://github.com/gluesys/lmcache-daos/blob/main/CHANGELOG.md"
Issues = "https://github.com/gluesys/lmcache-daos/issues"

[tool.setuptools]
packages = ["lmcache_daos", "lmcache_daos.mp"]

[tool.setuptools.dynamic]
version = { attr = "lmcache_daos.__version__" }
