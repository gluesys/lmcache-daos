[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-daos"
version = "0.0.1"
description = "DAOS storage backends for LMCache: in-process connector, MP-mode L2 adapter, GPU-direct backend"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Gluesys Co., Ltd." }]
keywords = ["lmcache", "daos", "kv-cache", "vllm", "gpudirect"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
    "Intended Audience :: Developers",
]
# No hard runtime deps: uses ctypes against the system libdaos/libdfs, and
# LMCache is expected to already be present in the serving environment.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["lmcache_daos", "lmcache_daos.mp"]
