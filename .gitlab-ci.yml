#
# What this pipeline can and cannot check.
#
# It runs the parts that need nothing but a Python interpreter: the on-disk
# object formats, the license headers, and syntax across the tree. That is a
# small slice of the repository, and deliberately so -- everything else needs a
# live DAOS cluster (pool, container, agent) and, for the GPU-direct backend,
# an H100 with a patched client stack. Those live in tests/ and are run by hand
# against the testbed; see deploy/README.md. Do not add a job here that silently
# skips when the cluster is missing: a green pipeline that checked nothing is
# worse than no pipeline.

stages: [check, test, package]

# The runner pool is mixed: some are docker executors, at least one is a shell
# executor on a host without python3. `image:` means nothing to the latter, so
# a job landing there fails with "python3 not on this runner" -- which is what
# happened until these jobs were pinned by tag.
#
# The 'Flexa' runner is the docker one. With a docker executor the default
# image is alpine (no python3, no git) and the clone is done by the helper
# container (so git is absent from the build image either way); hence both the
# explicit image and listing files with find rather than `git ls-files`.
default:
  image: python:3.12-slim
  tags: [Flexa]
  interruptible: true

variables:
  GIT_DEPTH: "20"

.python: &python
  before_script:
    - command -v python3 >/dev/null || { echo "python3 not on this runner"; exit 1; }
    - python3 --version

# The package declares requires-python >= 3.8 and uses no third-party runtime
# dependency, so the interpreter that happens to be on the runner is a fair
# test of that claim.
unit:
  stage: test
  <<: *python
  script:
    - python3 tests/test_serde.py
    - python3 tests/test_serde_v2.py
    # No DAOS needed: the wedge detector is a lock, two counters and a clock,
    # and the fault it looks for -- a thread that does not return -- is modelled
    # by an Event. Worth guarding here precisely because the real version of
    # that fault can only be reproduced by destroying a cluster.
    - python3 tests/test_wedge.py
    # Neither needs DAOS. The ABI test is the one that earns its place here:
    # a wrong daos_iod_t offset produces a binding that compiles, links and
    # corrupts, and the runner has no libdaos to catch it any other way.
    - python3 tests/test_serde_v3.py
    - python3 tests/test_obj_binding.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

syntax:
  stage: check
  <<: *python
  script:
    - echo "== python =="
    - find . -path ./.git -prune -o -name '*.py' -print | xargs -r -n50 python3 -m py_compile
    - echo "== shell =="
    - find . -path ./.git -prune -o -name '*.sh' -print | xargs -r -n1 bash -n
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Guards the licensing work: every source file carries an SPDX identifier, and
# the patches under gpudirect/ deliberately do not (they are diffs against
# upstream projects and keep those projects' licenses -- see NOTICE).
license-headers:
  stage: check
  script:
    - test -f LICENSE && test -f NOTICE
    - |
      sources=$(find . -path ./.git -prune -o \
        \( -name '*.py' -o -name '*.sh' -o -name '*.c' \) -print)
      missing=$(for f in $sources; do
          head -5 "$f" | grep -q 'SPDX-License-Identifier: Apache-2.0' || echo "$f";
        done)
      if [ -n "$missing" ]; then
        echo "SPDX header missing in:"; echo "$missing"; exit 1
      fi
      echo "SPDX headers present in all $(echo "$sources" | wc -l) sources"
    - |
      if grep -l 'SPDX-License-Identifier' gpudirect/patches/*.patch 2>/dev/null; then
        echo "patches must not carry our SPDX header (they are upstream derivatives)"; exit 1
      fi
      echo "patches clean"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Builds the wheel and sdist on every merge request, so a packaging break is
# caught when it is introduced rather than at release time. Nothing is
# published: there is no package index configured for this project, and the
# release artefacts are attached to the tag by hand.
#
# The version is single-sourced from lmcache_daos/__init__.py, so this also
# checks that pyproject really reads it -- and on a tag pipeline, that the tag
# and the package agree.
package:
  stage: package
  script:
    - pip install --quiet --disable-pip-version-check build twine
    - python -m build
    - ls -l dist/
    - python -m twine check dist/*
    - |
      pkg=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"',open('lmcache_daos/__init__.py').read()).group(1))")
      built=$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3.*/\1/')
      echo "package version: $pkg   built wheel: $built"
      [ "$pkg" = "$built" ] || { echo "pyproject did not pick up __version__"; exit 1; }
      if [ -n "$CI_COMMIT_TAG" ]; then
        [ "v$pkg" = "$CI_COMMIT_TAG" ] || { echo "tag $CI_COMMIT_TAG != v$pkg"; exit 1; }
        echo "tag matches package version"
      fi
    - |
      cd /tmp && pip install --quiet "$CI_PROJECT_DIR"/dist/*.whl
      python -c "import lmcache_daos; print('installed wheel imports, version', lmcache_daos.__version__)"
  artifacts:
    paths: [dist/]
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
